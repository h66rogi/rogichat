packages:
  - apps/api
  - apps/migration
  - apps/web
  - apps/overlay
  - packages/*

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # Match the reviewed Meloming frontend lockfile for its module-federation runtime.
    "@rspack/core>@module-federation/runtime-tools": "0.12.0"
engineStrict: true
minimumReleaseAge: 1440
# No dependency may run an installation script without an explicit review.
allowBuilds:
  # Reviewed: CLI Node compatibility check and pinned schema-engine download only.
  prisma@7.10.0: true
  '@prisma/engines@7.10.0': true
  # Original Meloming frontend dependencies: these install scripts are not
  # needed for the copied browser code or its verified production build.
  core-js@2.6.12: false
  core-js@3.50.0: false
  esbuild@0.17.19: false
  gl@9.0.0-rc.10: false
  '*': false
  '@scarf/scarf@1.4.0': false # Swagger UI install telemetry is unnecessary.
  # Overlay's pinned Next runtime uses prebuilt optional native packages.
  sharp@0.34.5: false
  unrs-resolver@1.12.2: false
  sharp: set this to true or false
  unrs-resolver: set this to true or false

# Prisma 7.10.0 pins the vulnerable connector; keep its only driver on the
# reviewed security release, including transitive adapter resolution.
overrides:
  '@prisma/adapter-mariadb>mariadb': 3.4.7

# Reviewed: hard-close timed-out transport without a second KILL connection,
# and never downgrade explicit certificate verification from a server greeting.
patchedDependencies:
  mariadb@3.4.7: patches/mariadb@3.4.7.patch
