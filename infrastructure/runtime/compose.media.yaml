# Applied only by the reviewed QA release helper when the media feature is selected.
# The decoder receives neither application/provider secrets nor a network.
services:
  api:
    environment:
      MEDIA_ENABLED: "true"
      MEDIA_SECRET_FILE: /run/secrets/media.json
      MEDIA_SCRATCH_DIR: /media-scratch
    volumes:
      - type: bind
        source: /etc/rogichat/media.json
        target: /run/secrets/media.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /media-scratch:rw,noexec,nosuid,nodev,size=134217728,uid=10001,gid=10001,mode=0700
  worker:
    environment:
      MEDIA_ENABLED: "true"
      MEDIA_SECRET_FILE: /run/secrets/media.json
      MEDIA_SCRATCH_DIR: /media-scratch
      MEDIA_DECODER_SOCKET: /run/decoder/image.sock
    volumes:
      - type: bind
        source: /etc/rogichat/media.json
        target: /run/secrets/media.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: decoder-socket
        target: /run/decoder
        read_only: true
        volume:
          nocopy: true
    tmpfs:
      - /media-scratch:rw,noexec,nosuid,nodev,size=134217728,uid=10001,gid=10001,mode=0700
  decoder:
    image: ${ROGICHAT_DECODER_IMAGE:?Set the approved decoder image identity}
    container_name: rogichat-qa-decoder
    command: [dist/media-decoder-main.js]
    restart: "no"
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    network_mode: none
    environment:
      DECODER_ISOLATED: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=134217728,uid=10001,gid=10001,mode=0700
    volumes:
      - type: volume
        source: decoder-socket
        target: /run/decoder
        volume:
          nocopy: true
    healthcheck:
      test: [CMD, node, -e, "const s=require('node:fs').statSync('/run/decoder/image.sock');process.exit(s.isSocket()?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  decoder-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1048576,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
