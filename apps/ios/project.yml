name: Rogichat
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug-QA: debug
  Release-QA: release
  Debug-Prod: debug
  Release-Prod: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: ko
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug-QA:
      APS_ENVIRONMENT: development
    Debug-Prod:
      APS_ENVIRONMENT: development
    Release-QA:
      APS_ENVIRONMENT: production
    Release-Prod:
      APS_ENVIRONMENT: production
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    exactVersion: 16.1.1
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    exactVersion: 4.0.8
  RogichatRooms:
    path: Packages/RogichatRooms
targets:
  Rogichat:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: Starscream
        product: Starscream
      - package: RogichatRooms
        product: RogichatRooms
    sources:
      - Sources
      - Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/SocketIO-LICENSE.txt
        buildPhase: resources
      - path: Resources/Starscream-LICENSE.txt
        buildPhase: resources
      - path: Resources/GRDB-LICENSE.txt
        buildPhase: resources
    configFiles:
      Debug-QA: Config/QA.xcconfig
      Release-QA: Config/QA.xcconfig
      Debug-Prod: Config/Prod.xcconfig
      Release-Prod: Config/Prod.xcconfig
schemes:
  Rogichat-QA:
    build:
      targets:
        Rogichat: all
    run:
      config: Debug-QA
    test:
      config: Debug-QA
    profile:
      config: Release-QA
    analyze:
      config: Debug-QA
    archive:
      config: Release-QA
  Rogichat-Prod:
    build:
      targets:
        Rogichat: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
