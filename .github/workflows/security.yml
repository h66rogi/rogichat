name: Security

on:
  push:
    branches: [qa, main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-repository:
    name: Public repository guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        run: python3 tools/security/install.py
      - name: Select scanner self-tests for the exact change
        id: self-tests
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python3 tools/security/changed.py
      - name: Test enforcement
        if: steps.self-tests.outputs.run_tests == 'true'
        run: python3 -m unittest discover -s tools/security -p 'test_*.py'
      - name: Scan tracked files and all history
        run: python3 tools/security/check.py all
