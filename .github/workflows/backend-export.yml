name: Backend verified image export
run-name: Backend export ${{ inputs.source_sha || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [QA backend image publication]
    types: [completed]
    branches: [qa]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA with four successful QA push checks
        required: true
      runtime_digest:
        description: Runtime registry sha256 hex (64 characters)
        required: true
      migration_digest:
        description: Migration registry sha256 hex (64 characters)
        required: true

      decoder_digest:
        description: Optional decoder registry sha256 hex; selects exact three-image v2 archive
        required: false
      publication_run_id:
        description: Optional exact QA publication run ID for event-driven images
        required: false
      publication_attempt:
        description: Exact attempt of the event-driven publication run
        required: false
      publication_proof_digest:
        description: Exact sha256 digest of the publication proof artifact ZIP
        required: false

permissions: {}

jobs:
  publication-result:
    # Scheduled publication recovery is followed by the independent export
    # reconciler. Skip the empty result runner on every quiet scheduled sweep.
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'h66rogi/rogichat' &&
      github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ github.event.workflow_run.id }}
          PUBLICATION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLICATION_PATH: ${{ github.event.workflow_run.path }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const run = Number(process.env.PUBLICATION_RUN);
          const attempt = Number(process.env.PUBLICATION_ATTEMPT);
          if (!Number.isSafeInteger(run) || run <= 0 || !Number.isSafeInteger(attempt) || attempt <= 0
              || process.env.PUBLICATION_PATH !== '.github/workflows/qa-backend-publication.yml') {
            throw new Error('Untrusted backend publication identity');
          }
          const response = await fetch(`https://api.github.com/repos/h66rogi/rogichat/actions/runs/${run}/attempts/${attempt}/jobs?per_page=100`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Publication jobs API failed (${response.status})`);
          const result = await response.json();
          if (!Array.isArray(result.jobs) || result.total_count !== result.jobs.length || result.jobs.length > 100) {
            throw new Error('Publication jobs listing incomplete');
          }
          const jobs = result.jobs.filter(job => job.name === 'Backend publication result');
          if (jobs.length > 1) throw new Error('Duplicate backend publication aggregate');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `published=${jobs.length === 1 && jobs[0].run_id === run && jobs[0].run_attempt === attempt && jobs[0].status === 'completed' && jobs[0].conclusion === 'success'}\n`);
          JS

  export:
    needs: publication-result
    if: >-
      always() && github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && needs.publication-result.result == 'success' &&
        needs.publication-result.outputs.published == 'true' && github.event.action == 'completed' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'qa' &&
        github.event.workflow_run.repository.full_name == 'h66rogi/rogichat' &&
        github.event.workflow_run.head_repository.full_name == 'h66rogi/rogichat' &&
        github.event.workflow_run.path == '.github/workflows/qa-backend-publication.yml' &&
        (github.event.workflow_run.event == 'workflow_run' ||
         github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Public source guard before package authentication
        run: |
          python3 tools/security/install.py
          python3 tools/security/check.py all
      - name: Verify and export exact published images (no build or deployment)
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPORT_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPORT_RUNTIME_DIGEST: ${{ inputs.runtime_digest }}
          EXPORT_MIGRATION_DIGEST: ${{ inputs.migration_digest }}
          EXPORT_DECODER_DIGEST: ${{ inputs.decoder_digest }}
          EXPORT_PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          EXPORT_PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
          EXPORT_PUBLICATION_PROOF_DIGEST: ${{ inputs.publication_proof_digest }}
        run: python3 tools/operations/backend_archive.py produce
      - name: Validate ID-only Compose image references without starting services
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          descriptor = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rogichat-export/descriptor.json').read_text())
          image = descriptor['images']['runtime']['config_id']
          env = {**os.environ, 'ROGICHAT_API_IMAGE': image, 'ROGICHAT_WORKER_IMAGE': image,
                 'ROGICHAT_EDGE_NETWORK': 'fixture-only-network-not-created'}
          subprocess.run(['docker', 'compose', '-f', 'infrastructure/runtime/compose.app.yaml', 'config', '--quiet'], env=env, check=True)
          PY
      - name: Scan all exported image layers before public artifact upload
        run: |
          set -euo pipefail
          python3 tools/security/install.py
          images=(runtime migration)
          if test -f "$RUNNER_TEMP/rogichat-export/decoder.tar"; then images+=(decoder); fi
          archives=()
          for image in "${images[@]}"; do
            printf '| %s transport tar | %s bytes |\n' "$image" \
              "$(stat -c %s "$RUNNER_TEMP/rogichat-export/$image.tar")" >> "$GITHUB_STEP_SUMMARY"
            archives+=("$RUNNER_TEMP/rogichat-export/$image.tar")
          done
          python3 tools/security/image_scan.py "${archives[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ steps.producer.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rogichat-export/descriptor.json
            ${{ runner.temp }}/rogichat-export/runtime.tar
            ${{ runner.temp }}/rogichat-export/runtime.manifest.json
            ${{ runner.temp }}/rogichat-export/migration.tar
            ${{ runner.temp }}/rogichat-export/migration.manifest.json
            ${{ runner.temp }}/rogichat-export/decoder.tar
            ${{ runner.temp }}/rogichat-export/decoder.manifest.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          overwrite: false
      - name: Record the completed proof-bound backend export
        if: steps.producer.outputs.publication_run_id != ''
        env:
          SOURCE_SHA: ${{ steps.producer.outputs.source_sha }}
          PUBLICATION_RUN_ID: ${{ steps.producer.outputs.publication_run_id }}
          PUBLICATION_ATTEMPT: ${{ steps.producer.outputs.publication_attempt }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          test "$PUBLICATION_RUN_ID" -gt 0
          test "$PUBLICATION_ATTEMPT" -gt 0
          printf '%s %s %s\n' "$SOURCE_SHA" "$PUBLICATION_RUN_ID" "$PUBLICATION_ATTEMPT" > "$RUNNER_TEMP/qa-backend-exported.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.producer.outputs.publication_run_id != ''
        with:
          name: qa-backend-exported-${{ steps.producer.outputs.source_sha }}
          path: ${{ runner.temp }}/qa-backend-exported.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
