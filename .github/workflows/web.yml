name: Web production
on:
  push:
    branches: [qa, main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare against the base
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python3 tools/release/changes.py --base "$BASE_SHA" --head "$GITHUB_SHA"

  verify:
    name: Lint, typecheck and unit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s tools/web -p 'test_*.py'
      - run: node --test tools/web/*.test.mjs
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test:unit
      - run: git diff --exit-code

  browser:
    name: Production build and browser ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Cache incremental web builds
        id: next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: web-next-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts') }}-${{ github.sha }}
          restore-keys: web-next-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts') }}-
      - name: Production build (no preview routes)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm web:build
      - name: Verify production artifacts
        run: pnpm web:check
      - name: Install real codec test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -hide_banner -version
      - name: Browser tests against the production artifact
        id: browser
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm --filter @rogichat/web exec playwright install --with-deps chromium
          pnpm --filter @rogichat/web exec playwright test --shard="$SHARD/3"
      - name: Retain failed browser evidence
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-web-browser-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 3
          if-no-files-found: ignore
      - run: git diff --exit-code

  container:
    name: Production container and all-layer security
    needs: changes
    if: needs.changes.outputs.web == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Measure cold and warm Docker builds and runtime size
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          start=$SECONDS
          docker build --platform linux/amd64 --file apps/web/Dockerfile --tag rogichat-web:check .
          cold=$((SECONDS - start))
          image_id=$(docker image inspect --format '{{.Id}}' rogichat-web:check)
          start=$SECONDS
          docker build --platform linux/amd64 --file apps/web/Dockerfile --tag rogichat-web:check .
          warm=$((SECONDS - start))
          test "$(docker image inspect --format '{{.Id}}' rogichat-web:check)" = "$image_id"
          bytes=$(docker image inspect --format '{{.Size}}' rogichat-web:check)
          printf '| Web runtime | %s s | %s s | %s bytes |\n' "$cold" "$warm" "$bytes" >> "$GITHUB_STEP_SUMMARY"
      - run: bash tools/web/check-image.sh rogichat-web:check
      - name: Fail-closed scan of every runtime layer and metadata
        run: |
          set -euo pipefail
          python3 tools/security/install.py
          docker image save rogichat-web:check | python3 tools/security/image_scan.py -

  required:
    # Always reported so a required status never stays pending when the path filter skips verification.
    name: Web required checks
    needs: [changes, verify, browser, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate (fail closed)
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.web }}
          VERIFY: ${{ needs.verify.result }}
          BROWSER: ${{ needs.browser.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          echo "changes: $CHANGES_RESULT, web changed: '$CHANGED', verify: $VERIFY, browser: $BROWSER"
          if [ "$CHANGES_RESULT" != "success" ]; then echo "change detection did not succeed"; exit 1; fi
          case "$CHANGED:$VERIFY:$BROWSER:$CONTAINER:$GITHUB_EVENT_NAME" in
            false:skipped:skipped:skipped:*) echo "no web change; verification skipped"; exit 0 ;;
            true:success:success:success:pull_request|true:success:success:success:merge_group|true:success:success:success:workflow_dispatch)
              echo "web verified with pre-merge image safety"; exit 0 ;;
            true:success:success:skipped:push) echo "web verified; publisher checks the image"; exit 0 ;;
            *) echo "unexpected combination"; exit 1 ;;
          esac
