name: QA backend image publication

on:
  workflow_run:
    workflows: [Mobile foundation]
    types: [completed]
    branches: [qa]
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions: {}

# A delayed completion event or scheduled recovery cannot race another publisher
# for the same source. Each component also checks the immutable tag after scanning.
concurrency:
  group: qa-backend-publication-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      backend: ${{ steps.preflight.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate event and exact five QA required jobs
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/operations/qa_publication_gate.mjs
      - name: Find the last proven backend source for cumulative change detection
        id: previous
        if: steps.verify.outputs.ready == 'true'
        env:
          PUBLICATION_KIND: backend
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/operations/qa_publication_base.mjs
      - name: Classify trusted QA source change
        id: classify
        if: steps.verify.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          BASE_SHA: ${{ steps.previous.outputs.base }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/release/changes.py --base "$BASE_SHA" --head "$SOURCE_SHA"
      - name: Skip only verified completed backend publications
        id: preflight
        if: steps.verify.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          WEB_CHANGED: 'false'
          BACKEND_CHANGED: ${{ steps.classify.outputs.backend_image }}
        run: node tools/operations/qa_publication_preflight.mjs

  publish-backend:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && needs.gate.outputs.backend == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/backend-publish.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}

  backend-result:
    name: Backend publication result
    needs: [gate, publish-backend]
    if: always() && needs.gate.outputs.ready == 'true' && needs.publish-backend.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record completed backend publication for bounded recovery
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/qa-backend-published.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-backend-published-${{ needs.gate.outputs.source_sha }}
          path: ${{ runner.temp }}/qa-backend-published.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-backend-published-base
          path: ${{ runner.temp }}/qa-backend-published.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
