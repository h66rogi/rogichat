name: Meloming media gateway copy and QA image

on:
  pull_request:
    paths:
      - '.github/workflows/media-gateway.yml'
      - '.dockerignore'
      - '.gitleaks.toml'
      - 'AGENTS.md'
      - 'apps/media-gateway/**'
      - 'docs/meloming-media-gateway-source-manifest.tsv'
      - 'infrastructure/runtime/media-gateway.Dockerfile'
      - 'infrastructure/runtime/web/compose.media-gateway.qa.yaml'
      - 'infrastructure/runtime/Caddyfile.app'
      - 'tools/check_media_gateway_copy.py'
      - 'tools/infrastructure/auxiliary_image_changes.py'
      - 'tools/security/**'
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: media-gateway-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 tools/infrastructure/auxiliary_image_changes.py --component gateway --base "$BASE_SHA" --head "$GITHUB_SHA"
  source-test-image:
    needs: changes
    if: >-
      always() && (github.event_name == 'pull_request' ||
      (needs.changes.result == 'success' && needs.changes.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the original R2-capable source and tests
        run: python3 tools/check_media_gateway_copy.py
      - name: Run copied gateway tests in an isolated image build
        run: docker build --platform linux/amd64 --file infrastructure/runtime/media-gateway.Dockerfile --target test .
      - name: Build gateway image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file infrastructure/runtime/media-gateway.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/h66rogi/rogichat \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA" .
      - name: Import the app from the final runtime image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e S3_ACCESS_KEY_ID=fixture -e S3_SECRET_ACCESS_KEY=fixture -e S3_BUCKET=fixture \
            "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA" \
            python -c 'from meloming_media_gateway.app import app; assert app is not None'
      - name: Scan the built image before registry authentication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/security/install.py
          image_id=$(docker image inspect --format '{{.Id}}' "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA")
          docker image save "$image_id" | python3 tools/security/image_scan.py -
      - name: Publish reviewed QA gateway image
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          docker push "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA"
          docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA"
      - name: Export the reviewed QA image without registry credentials
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rogichat-gateway-export"
          mkdir -p "$output"
          docker save "ghcr.io/h66rogi/rogichat-media-gateway:qa-$SOURCE_SHA" -o "$output/image.tar"
          python3 tools/security/image_scan.py "$output/image.tar"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = os.environ['SOURCE_SHA']
          image = f'ghcr.io/h66rogi/rogichat-media-gateway:qa-{source}'
          data = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
          assert data['Config']['Labels']['org.opencontainers.image.revision'] == source
          assert len(data['RepoDigests']) == 1
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rogichat-gateway-export/image.tar'
          descriptor = {'source_sha': source, 'image': image,
                        'config_id': data['Id'], 'registry_digest': data['RepoDigests'][0],
                        'archive_sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()}
          archive.with_name('descriptor.json').write_text(json.dumps(descriptor, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        with:
          name: gateway-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rogichat-gateway-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
