name: Mobile foundation
on:
  push:
    branches: [qa, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/mobile/changed.py
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml
            tools/mobile/check_android.py
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Reject synthetic product entry points in either environment
        run: python3 tools/mobile/product_guards.py
      - name: Compile every variant and check environment separation
        working-directory: apps/android
        run: ./gradlew :app:assembleQaDebug :app:assembleQaRelease :app:assembleProdDebug :app:assembleProdRelease :app:test :app:lint :app:lintQaDebug :app:lintQaRelease :app:lintProdRelease --no-daemon
      - name: Verify packaged APK configuration
        run: python3 tools/mobile/check_android.py
      - name: Verify QA release upload guards
        run: python3 -m unittest discover -s tools/mobile -p 'test_*.py'
  android-signing:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml
            tools/mobile/release_android.py
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Build signed QA APK and AAB using an ephemeral test key
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'rogichat-signing-test'
          root.mkdir(mode=0o700)
          config = root / 'config.json'
          config.write_text(json.dumps({'artifact_root': str(root / 'artifacts'), 'android': {
            'keystore': str(root / 'test.jks'), 'password_file': str(root / 'password.txt'), 'key_alias': 'qa'
          }}))
          config.chmod(0o600)
          PY
          python3 tools/mobile/qa_release.py --config "$RUNNER_TEMP/rogichat-signing-test/config.json" android-init-key
          python3 tools/mobile/qa_release.py --config "$RUNNER_TEMP/rogichat-signing-test/config.json" android-build --build-number 7
  android-storage:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml
            tools/mobile/check_android_storage.py
      - name: Install fixed platform and storage-test system image
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"'
      - name: Allow this ephemeral hosted runner to use KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify actual Keystore and on-disk SQLite with an isolated emulator
        run: python3 tools/mobile/check_android_storage.py
  ios-state:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check product state and test-only scenario isolation without a simulator
        run: python3 tools/mobile/check_ios_wireframe.py
      - name: Verify signing security with a disposable keychain
        env:
          ROGICHAT_TEST_DISPOSABLE_KEYCHAIN: '1'
        run: python3 -m unittest discover -s tools/mobile -p 'test_*.py'
  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify generated project is current
        run: |
          python3 tools/mobile/install_xcodegen.py
          .tools/xcodegen-2.44.1/xcodegen/bin/xcodegen generate --spec apps/ios/project.yml
          git diff --exit-code -- apps/ios/Rogichat.xcodeproj
      - name: Build and inspect QA and production bundles
        run: python3 tools/mobile/build_ios.py
  required:
    name: Mobile required checks
    if: always()
    needs: [changes, android, android-signing, android-storage, ios-state, ios-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds for each affected platform
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_SIGNING_RESULT: ${{ needs.android-signing.result }}
          ANDROID_STORAGE_RESULT: ${{ needs.android-storage.result }}
          IOS_STATE_RESULT: ${{ needs.ios-state.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-build.result }}
        run: |
          test "$CHANGE_RESULT" = success
          case "$ANDROID_CHANGED:$ANDROID_RESULT:$ANDROID_SIGNING_RESULT:$ANDROID_STORAGE_RESULT" in
            true:success:success:success|false:skipped:skipped:skipped) ;;
            *) echo "unexpected Android result"; exit 1 ;;
          esac
          case "$IOS_CHANGED:$IOS_STATE_RESULT:$IOS_BUILD_RESULT" in
            true:success:success|false:skipped:skipped) ;;
            *) echo "unexpected iOS result"; exit 1 ;;
          esac
