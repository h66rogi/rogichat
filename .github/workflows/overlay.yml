name: Meloming overlay copy

on:
  pull_request:
    paths:
      - '.github/workflows/overlay.yml'
      - '.dockerignore'
      - '.gitleaks.toml'
      - '.node-version'
      - 'AGENTS.md'
      - 'apps/overlay/**'
      - 'apps/*/package.json'
      - 'docs/meloming-overlay-source-manifest.tsv'
      - 'infrastructure/runtime/overlay.Dockerfile'
      - 'infrastructure/runtime/web/compose.overlay.qa.yaml'
      - 'infrastructure/runtime/web/Caddyfile.qa'
      - 'package.json'
      - 'packages/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tools/check_overlay_copy.py'
      - 'tools/infrastructure/auxiliary_image_changes.py'
      - 'tools/security/**'
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: overlay-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 tools/infrastructure/auxiliary_image_changes.py --component overlay --base "$BASE_SHA" --head "$GITHUB_SHA"
  source-and-build:
    name: Exact source, theme catalog and production build
    needs: changes
    if: >-
      always() && (github.event_name == 'pull_request' ||
      (needs.changes.result == 'success' && needs.changes.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify original files and locked dependencies
        run: |
          python3 tools/check_overlay_copy.py
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Validate original theme catalog
        run: pnpm --filter meloming-overlay check:themes
      - name: Compile original OBS overlay in CI
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: https://api.qa.rogi.chat
          NEXT_PUBLIC_GATEWAY_BASE_URL: https://api.qa.rogi.chat
          NEXT_PUBLIC_GATEWAY_SOCKET_PATH: /socket.io
          NEXT_PUBLIC_FRONT_BASE_URL: https://qa.rogi.chat
        run: pnpm --filter meloming-overlay build
      - name: Build the QA OBS image from the verified source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file infrastructure/runtime/overlay.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/h66rogi/rogichat \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --tag "ghcr.io/h66rogi/rogichat-overlay:qa-$SOURCE_SHA" .
      - name: Scan the built image before any registry authentication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 tools/security/install.py
          image_id=$(docker image inspect --format '{{.Id}}' "ghcr.io/h66rogi/rogichat-overlay:qa-$SOURCE_SHA")
          docker image save "$image_id" | python3 tools/security/image_scan.py -
      - name: Publish reviewed QA overlay image
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          docker push "ghcr.io/h66rogi/rogichat-overlay:qa-$SOURCE_SHA"
          docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/h66rogi/rogichat-overlay:qa-$SOURCE_SHA"
      - name: Export the reviewed QA image without registry credentials
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rogichat-overlay-export"
          mkdir -p "$output"
          docker save "ghcr.io/h66rogi/rogichat-overlay:qa-$SOURCE_SHA" -o "$output/image.tar"
          python3 tools/security/image_scan.py "$output/image.tar"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = os.environ['SOURCE_SHA']
          image = f'ghcr.io/h66rogi/rogichat-overlay:qa-{source}'
          data = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
          assert data['Config']['Labels']['org.opencontainers.image.revision'] == source
          assert len(data['RepoDigests']) == 1
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rogichat-overlay-export/image.tar'
          descriptor = {'source_sha': source, 'image': image,
                        'config_id': data['Id'], 'registry_digest': data['RepoDigests'][0],
                        'archive_sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()}
          archive.with_name('descriptor.json').write_text(json.dumps(descriptor, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' && github.event_name == 'push'
        with:
          name: overlay-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rogichat-overlay-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
