name: Backend foundation
on:
  push:
    branches: [qa, main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      image: ${{ steps.classify.outputs.backend_image }}
      tests: ${{ steps.classify.outputs.backend_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python3 tools/release/changes.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'

  static:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Unit tests against the checked build
        working-directory: apps/api
        run: node --test test/unit/*.test.mjs
      - name: End-to-end tests against the checked build
        working-directory: apps/api
        run: node --test test/e2e/*.test.mjs
      - name: Contract tests against the checked build
        working-directory: apps/api
        run: node --test test/contracts/*.test.mjs
      - name: Export OpenAPI without credentials or application I/O
        working-directory: apps/api
        run: node tools/export-openapi.mjs
      - name: Upload generated API contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ github.sha }}
          path: apps/api/build/openapi/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Isolated QA release helper contracts
        run: |
          python3 -m unittest discover -s tools/operations -p 'test_backend_*.py'
          node --test tools/operations/test_migrate_entry.mjs
          node --test apps/api/ci/verify_backend_publication_source.test.mjs
      - run: git diff --exit-code

  integration:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install and compile the exact source
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm --filter @rogichat/api build
      - name: Readonly schema probe on disposable MySQL
        if: matrix.shard == 0
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: node tools/operations/test_backend_schema_mysql.mjs
      - name: MySQL integration and process lifecycle, isolated shard
        working-directory: apps/api
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: node test/run-mysql.mjs --shard-index=${{ matrix.shard }} --shard-count=4
      - run: git diff --exit-code
  image-safety:
    needs: changes
    if: needs.changes.outputs.image == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tools/security/install.py
      - name: Build and inspect both images without registry or cloud credentials
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          scan_args=()
          for target in runtime migration; do
            image="rogichat-check:$target"
            start=$SECONDS
            docker build --platform linux/amd64 --file apps/api/Dockerfile --target "$target" --tag "$image" .
            cold=$((SECONDS - start))
            image_id=$(docker image inspect --format '{{.Id}}' "$image")
            start=$SECONDS
            docker build --platform linux/amd64 --file apps/api/Dockerfile --target "$target" --tag "$image" .
            warm=$((SECONDS - start))
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
            bytes=$(docker image inspect --format '{{.Size}}' "$image")
            printf '| %s | %s s | %s s | %s bytes |\n' "$target" "$cold" "$warm" "$bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            scan_args+=(--docker-image "$image_id")
          done
          # One scanner invocation retains exact-content scan results across
          # the shared runtime and migration layers. Each image still receives
          # independent archive limits, layer checks and failure handling.
          python3 tools/security/image_scan.py "${scan_args[@]}"
      - name: Keep decoder-only dependencies out of the API image
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            rogichat-check:runtime --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          assert.throws(() => require.resolve('sharp'), { code: 'MODULE_NOT_FOUND' });
          JS
      - name: Verify lean migration image with its real CLI and driver
        run: |
          set -euo pipefail
          image=rogichat-check:migration
          bytes=$(docker image inspect --format '{{.Size}}' "$image")
          printf 'Migration image size: %s bytes\n' "$bytes"
          test "$bytes" -lt 1000000000
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/apps/api/test/migration-image.mjs,dst=/run/migration-image-check.mjs,readonly" \
            "$image" /run/migration-image-check.mjs
  verify:
    if: always()
    needs: [changes, static, integration, image-safety]
    runs-on: ubuntu-24.04
    steps:
      - name: Require tests and pre-merge image safety
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.backend }}
          TEST_CHANGED: ${{ needs.changes.outputs.tests }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image }}
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          IMAGE_RESULT: ${{ needs.image-safety.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGE_RESULT" = success
          if test "$CHANGED" = false; then
            test "$TEST_CHANGED" = false
            test "$IMAGE_CHANGED" = false
            test "$STATIC_RESULT" = skipped
            test "$INTEGRATION_RESULT" = skipped
            test "$IMAGE_RESULT" = skipped
            exit 0
          fi
          test "$CHANGED" = true
          test "$TEST_CHANGED" = true || test "$IMAGE_CHANGED" = true
          if test "$TEST_CHANGED" = true; then
            test "$STATIC_RESULT" = success
            test "$INTEGRATION_RESULT" = success
          else
            test "$TEST_CHANGED" = false
            test "$STATIC_RESULT" = skipped
            test "$INTEGRATION_RESULT" = skipped
          fi
          if test "$IMAGE_CHANGED" = false; then
            test "$IMAGE_RESULT" = skipped
          elif test "$IMAGE_CHANGED" = true && { test "$EVENT_NAME" = pull_request || test "$EVENT_NAME" = merge_group || test "$EVENT_NAME" = workflow_dispatch; }; then
            test "$IMAGE_RESULT" = success
          else
            test "$IMAGE_CHANGED" = true
            test "$EVENT_NAME" = push
            test "$IMAGE_RESULT" = skipped
          fi
