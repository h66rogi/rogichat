name: Backend foundation
on:
  push:
    branches: [qa, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/release/changes.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'

  static:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm contracts:check
      - name: Export OpenAPI without credentials or application I/O
        run: pnpm --filter @rogichat/api openapi:export
      - name: Upload generated API contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ github.sha }}
          path: apps/api/build/openapi/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Isolated QA release helper contracts
        run: |
          python3 -m unittest discover -s tools/operations -p 'test_backend_*.py'
          node --test tools/operations/test_migrate_entry.mjs
      - run: git diff --exit-code

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install and compile the exact source
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm --filter @rogichat/api build
      - name: Readonly schema probe on disposable MySQL
        if: matrix.shard == 0
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: node tools/operations/test_backend_schema_mysql.mjs
      - name: MySQL integration and process lifecycle, isolated shard
        working-directory: apps/api
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: node test/run-mysql.mjs --shard-index=${{ matrix.shard }} --shard-count=4
      - run: git diff --exit-code
  image-safety:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tools/security/install.py
      - name: Build and inspect both images without registry or cloud credentials
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          for target in runtime migration; do
            image="rogichat-check:$target"
            start=$SECONDS
            docker build --platform linux/amd64 --file apps/api/Dockerfile --target "$target" --tag "$image" .
            cold=$((SECONDS - start))
            image_id=$(docker image inspect --format '{{.Id}}' "$image")
            start=$SECONDS
            docker build --platform linux/amd64 --file apps/api/Dockerfile --target "$target" --tag "$image" .
            warm=$((SECONDS - start))
            test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
            bytes=$(docker image inspect --format '{{.Size}}' "$image")
            printf '| %s | %s s | %s s | %s bytes |\n' "$target" "$cold" "$warm" "$bytes" >> "$GITHUB_STEP_SUMMARY"
            docker image save "$image_id" | python3 tools/security/image_scan.py -
          done
      - name: Verify lean migration image with its real CLI and driver
        run: |
          set -euo pipefail
          image=rogichat-check:migration
          bytes=$(docker image inspect --format '{{.Size}}' "$image")
          printf 'Migration image size: %s bytes\n' "$bytes"
          test "$bytes" -lt 1000000000
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$image" \
            -e "const fs=require('node:fs');const path=require('node:path');const p=require('prisma/package.json');const engine=path.dirname(require.resolve('@prisma/engines/package.json',{paths:[require.resolve('prisma/package.json')]}));const checks={version:p.version==='7.10.0',engine:fs.existsSync(path.join(engine,'schema-engine-debian-openssl-3.0.x')),driver:typeof require('mysql2/promise').createConnection==='function',schema:fs.existsSync('prisma/schema.prisma'),isolated:!fs.existsSync('dist/main.js')};console.log(checks);if(Object.values(checks).some(ok=>!ok))process.exit(1)"
  verify:
    if: always()
    needs: [changes, static, integration, image-safety]
    runs-on: ubuntu-24.04
    steps:
      - name: Require tests and pre-merge image safety
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.backend }}
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          IMAGE_RESULT: ${{ needs.image-safety.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGE_RESULT" = success
          if test "$CHANGED" = false; then
            test "$STATIC_RESULT" = skipped
            test "$INTEGRATION_RESULT" = skipped
            test "$IMAGE_RESULT" = skipped
            exit 0
          fi
          test "$CHANGED" = true
          test "$STATIC_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          if test "$EVENT_NAME" = pull_request || test "$EVENT_NAME" = workflow_dispatch; then
            test "$IMAGE_RESULT" = success
          else
            test "$EVENT_NAME" = push
            test "$IMAGE_RESULT" = skipped
          fi
