name: Backend foundation
on:
  push:
    branches: [qa, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          # Synthetic, isolated runner fixture, never a QA/production credential.
          MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@12.4.2 --ignore-scripts
          pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:e2e
      - run: pnpm contracts:check
      - name: Export OpenAPI without credentials or application I/O
        run: pnpm --filter @rogichat/api openapi:export
      - name: Upload generated API contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-${{ github.sha }}
          path: apps/api/build/openapi/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Isolated QA release helper contracts
        run: |
          python3 -m unittest discover -s tools/operations -p 'test_backend_*.py'
          node --test tools/operations/test_migrate_entry.mjs
      - name: Readonly schema probe on disposable MySQL
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: node tools/operations/test_backend_schema_mysql.mjs
      - name: MySQL integration and process lifecycle
        env:
          ROGICHAT_TEST_MYSQL: disposable
          TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          TEST_MYSQL_ROOT_PASSWORD: fixture-only-not-a-service-secret
        run: pnpm test:integration
      - run: git diff --exit-code
  image-safety:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tools/security/install.py
      - name: Build and inspect both images without registry or cloud credentials
        run: |
          set -euo pipefail
          for target in runtime migration; do
            image="rogichat-check:$target"
            docker build --platform linux/amd64 --file apps/api/Dockerfile --target "$target" --tag "$image" .
            image_id=$(docker image inspect --format '{{.Id}}' "$image")
            docker image save "$image_id" | python3 tools/security/image_scan.py -
          done
  verify:
    if: always()
    needs: [tests, image-safety]
    runs-on: ubuntu-24.04
    steps:
      - name: Require tests and pre-merge image safety
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          IMAGE_RESULT: ${{ needs.image-safety.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$TEST_RESULT" = success
          if test "$EVENT_NAME" = pull_request || test "$EVENT_NAME" = workflow_dispatch; then
            test "$IMAGE_RESULT" = success
          else
            test "$EVENT_NAME" = push
            test "$IMAGE_RESULT" = skipped
          fi
