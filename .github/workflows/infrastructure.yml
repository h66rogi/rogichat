name: Infrastructure validation
on:
  push:
    branches: [qa, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 tools/infrastructure/install.py
      - name: Validate formatting
        run: .tools/terraform fmt -check -recursive infrastructure
      - name: Test with mock providers and ephemeral fixture key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t rsa -b 2048 -N '' -f .tools/test-key
          export TF_VAR_ssh_public_key_path="$PWD/.tools/test-key.pub"
          for provider in aws cloudflare; do
            root="infrastructure/environments/qa/$provider"
            .tools/terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            .tools/terraform -chdir="$root" validate
            .tools/terraform -chdir="$root" test -no-color
          done
      - name: Validate Caddy and Compose without contacting ACME
        run: |
          .tools/caddy adapt --config infrastructure/runtime/Caddyfile.bootstrap --adapter caddyfile --validate > /dev/null
          docker compose -f infrastructure/runtime/compose.bootstrap.yaml config --quiet
