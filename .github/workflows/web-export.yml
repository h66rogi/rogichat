name: Web verified image export
run-name: Web export ${{ inputs.source_sha || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Web image publication, QA web image publication]
    types: [completed]
    branches: [qa]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA with successful QA checks and publication
        required: true
      runtime_digest:
        description: Web registry sha256 hex (64 characters)
        required: true
      publication_run_id:
        description: Optional exact QA publication run ID for event-driven images
        required: false
      publication_attempt:
        description: Exact attempt of the event-driven publication run
        required: false

permissions: {}

jobs:
  publication-result:
    # Scheduled publication recovery is followed by the independent export
    # reconciler. Skip the empty result runner on every quiet scheduled sweep.
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'h66rogi/rogichat' &&
      github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ github.event.workflow_run.id }}
          PUBLICATION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLICATION_PATH: ${{ github.event.workflow_run.path }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const run = Number(process.env.PUBLICATION_RUN);
          const attempt = Number(process.env.PUBLICATION_ATTEMPT);
          if (!Number.isSafeInteger(run) || run <= 0 || !Number.isSafeInteger(attempt) || attempt <= 0) {
            throw new Error('Invalid publication run or attempt');
          }
          const expected = ({
            '.github/workflows/web-publish.yml': 'publish',
            '.github/workflows/qa-web-publication.yml': 'Web publication result',
          })[process.env.PUBLICATION_PATH];
          if (!expected) throw new Error('Untrusted publication path');
          const response = await fetch(`https://api.github.com/repos/h66rogi/rogichat/actions/runs/${run}/attempts/${attempt}/jobs?per_page=100`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Publication jobs API failed (${response.status})`);
          const result = await response.json();
          if (!Array.isArray(result.jobs) || result.total_count !== result.jobs.length || result.jobs.length > 100) {
            throw new Error('Publication jobs listing incomplete');
          }
          const jobs = result.jobs.filter(job => job.name === expected);
          if (jobs.length > 1 || (jobs.length === 0 && expected === 'publish')) {
            throw new Error('Publication job missing or duplicate');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `published=${jobs.length === 1 && jobs[0].run_id === run && jobs[0].run_attempt === attempt && jobs[0].status === 'completed' && jobs[0].conclusion === 'success'}\n`);
          JS

  export:
    needs: publication-result
    if: >-
      always() && github.repository == 'h66rogi/rogichat' && github.ref == 'refs/heads/qa' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && needs.publication-result.result == 'success' &&
        needs.publication-result.outputs.published == 'true' && github.event.action == 'completed' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'qa' &&
        github.event.workflow_run.repository.full_name == 'h66rogi/rogichat' &&
        github.event.workflow_run.head_repository.full_name == 'h66rogi/rogichat' &&
        ((github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.path == '.github/workflows/web-publish.yml') ||
         ((github.event.workflow_run.event == 'workflow_run' ||
           github.event.workflow_run.event == 'schedule' ||
           github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.path == '.github/workflows/qa-web-publication.yml'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact QA source, publication and published image archive
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPORT_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPORT_RUNTIME_DIGEST: ${{ inputs.runtime_digest }}
          EXPORT_PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          EXPORT_PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        run: python3 tools/web/archive.py produce
      - name: Scan every exported layer before artifact upload
        run: |
          printf '| Web transport tar | %s bytes |\n' \
            "$(stat -c %s "$RUNNER_TEMP/rogichat-export/runtime.tar")" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/security/install.py
          python3 tools/security/image_scan.py "$RUNNER_TEMP/rogichat-export/runtime.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ steps.producer.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rogichat-export/descriptor.json
            ${{ runner.temp }}/rogichat-export/runtime.tar
            ${{ runner.temp }}/rogichat-export/runtime.manifest.json
            ${{ runner.temp }}/rogichat-export/publication-proof.zip
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          overwrite: false
      - name: Record the completed proof-bound web export
        if: steps.producer.outputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ steps.producer.outputs.source_sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/qa-web-exported.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.producer.outputs.source_sha != ''
        with:
          name: qa-web-exported-${{ steps.producer.outputs.source_sha }}
          path: ${{ runner.temp }}/qa-web-exported.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
